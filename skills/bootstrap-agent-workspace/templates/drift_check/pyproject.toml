[project]
name = "drift-check"
version = "0.1.0"
description = "Generic spec <-> code drift detector for spec-driven projects"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
drift-check = "drift_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
