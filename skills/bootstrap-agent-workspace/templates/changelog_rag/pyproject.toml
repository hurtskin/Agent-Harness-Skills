[project]
name = "changelog-rag"
version = "0.1.0"
description = "Local MCP server for semantic retrieval over 决策日志.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "sentence-transformers>=2.7.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/changelog_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (loads embedding model, ~10s) — opt-in via --run-slow",
]

[tool.ruff]
line-length = 100
target-version = "py310"