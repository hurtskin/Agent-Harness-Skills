name: bootstrap-agent-workspace

on:
  push:
    paths:
      - "skills/bootstrap-agent-workspace/**"
      - ".github/workflows/bootstrap-agent-workspace.yml"
  pull_request:
    paths:
      - "skills/bootstrap-agent-workspace/**"
      - ".github/workflows/bootstrap-agent-workspace.yml"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Run workspace self-check
        run: uv run --no-project python skills/bootstrap-agent-workspace/scripts/self_check.py
      - name: Test workspace self-check
        run: uv run --no-project python -m unittest discover -s skills/bootstrap-agent-workspace/tests -v
      - name: Test changelog-rag template (offline-safe cases)
        run: >-
          uv run --project skills/bootstrap-agent-workspace/templates/changelog_rag --extra dev
          pytest skills/bootstrap-agent-workspace/templates/changelog_rag/tests/test_core.py
          -k "parse or latest_version or append_entry or update_entry or delete_entry"
      - name: Test drift-check template
        run: >-
          uv run --project skills/bootstrap-agent-workspace/templates/drift_check --extra dev
          pytest skills/bootstrap-agent-workspace/templates/drift_check/tests
